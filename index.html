ons","title":"Permutations & Combinations"},{"id":"binomial-theorem","title":"Binomial Theorem"},{"id":"matrices-and-determinants","title":"Matrices & Determinants"},{"id":"probability","title":"Probability"},{"id":"statistics","title":"Statistics"}]},{"title":"Trigonometry","chapters":[{"id":"trigonometric-ratios-and-identities","title":"Trigonometric Ratios & Identities"},{"id":"trigonometric-equations","title":"Trigonometric Equations"},{"id":"inverse-trigonometric-functions","title":"Inverse Trigonometric Functions"},{"id":"properties-of-triangles","title":"Properties of Triangles"}]},{"title":"Coordinate Geometry","chapters":[{"id":"straight-lines","title":"Straight Lines"},{"id":"circles","title":"Circles"},{"id":"parabola","title":"Parabola"},{"id":"ellipse","title":"Ellipse"},{"id":"hyperbola","title":"Hyperbola"}]},{"title":"Calculus","chapters":[{"id":"limits-continuity-and-differentiability","title":"Limits, Continuity & Differentiability"},{"id":"differentiation","title":"Differentiation"},{"id":"applications-of-derivatives","title":"Applications of Derivatives"},{"id":"indefinite-integration","title":"Indefinite Integration"},{"id":"definite-integration","title":"Definite Integration"},{"id":"area-under-curves","title":"Area Under Curves"},{"id":"differential-equations","title":"Differential Equations"}]},{"title":"Vectors & 3D Geometry","chapters":[{"id":"vector-algebra","title":"Vector Algebra"},{"id":"three-dimensional-geometry","title":"Three-Dimensional Geometry"}]}]}],"chapters":[{"id":"electrostatics","title":"Electrostatics","subject":"Physics","unit":"Electromagnetism","tagline":"Charges, fields, flux and potential — from “why does a balloon stick to a wall?” to the hardest Gauss’s-law problems JEE Advanced has ever set.","lessons":[{"n":1,"title":"Charge & Coulomb’s Law","summary":"Meet the property that makes matter push and pull — and the one equation that every other idea in this chapter is built on.","minutes":30,"questions":[{"id":"electrostatics.1.1","pyq":false},{"id":"electrostatics.1.2","pyq":false},{"id":"electrostatics.1.3","pyq":true},{"id":"electrostatics.1.4","pyq":true}]},{"n":2,"title":"The Electric Field","summary":"How does one charge “know” another is there? It doesn’t. It only feels the field at its own location — and that single idea makes every hard problem simpler.","minutes":35,"questions":[{"id":"electrostatics.2.1","pyq":false},{"id":"electrostatics.2.2","pyq":false},{"id":"electrostatics.2.3","pyq":true},{"id":"electrostatics.2.4","pyq":true}]},{"n":3,"title":"Flux & Gauss’s Law","summary":"Stop adding up vectors. Start counting field lines. This is the idea JEE Advanced tests more creatively than any other in the chapter.","minutes":40,"questions":[{"id":"electrostatics.3.1","pyq":true},{"id":"electrostatics.3.2","pyq":false},{"id":"electrostatics.3.3","pyq":true},{"id":"electrostatics.3.4","pyq":true},{"id":"electrostatics.3.5","pyq":true},{"id":"electrostatics.3.6","pyq":true},{"id":"electrostatics.3.7","pyq":true}]},{"n":4,"title":"Gauss’s Law at Work","summary":"Spheres, wires, sheets and cavities. With the right symmetry, an integral that would fill a page collapses into one line of algebra.","minutes":40,"questions":[{"id":"electrostatics.4.1","pyq":false},{"id":"electrostatics.4.2","pyq":false},{"id":"electrostatics.4.3","pyq":true},{"id":"electrostatics.4.4","pyq":true},{"id":"electrostatics.4.5","pyq":true},{"id":"electrostatics.4.6","pyq":true},{"id":"electrostatics.4.7","pyq":true}]},{"n":5,"title":"Potential & Potential Energy","summary":"Fields are vectors, and vectors are hard work. Potential is just a number at every point — the “height map” of electricity — and energy conservation does the rest.","minutes":40,"questions":[{"id":"electrostatics.5.1","pyq":true},{"id":"electrostatics.5.2","pyq":true},{"id":"electrostatics.5.3","pyq":false},{"id":"electrostatics.5.4","pyq":true},{"id":"electrostatics.5.5","pyq":true},{"id":"electrostatics.5.6","pyq":true},{"id":"electrostatics.5.7","pyq":false},{"id":"electrostatics.5.8","pyq":true}]},{"n":6,"title":"The Electric Dipole","summary":"Two equal and opposite charges, close together. It is the simplest neutral object that still has a field — and it is how most of the matter around you actually behaves.","minutes":25,"questions":[{"id":"electrostatics.6.1","pyq":false},{"id":"electrostatics.6.2","pyq":true},{"id":"electrostatics.6.3","pyq":false},{"id":"electrostatics.6.4","pyq":true}]},{"n":7,"title":"Conductors in Equilibrium","summary":"Give charges the freedom to move and they arrange themselves until there is nothing left to push them. Five consequences follow — and half of JEE’s shell problems with them.","minutes":35,"questions":[{"id":"electrostatics.7.1","pyq":false},{"id":"electrostatics.7.2","pyq":false},{"id":"electrostatics.7.3","pyq":true},{"id":"electrostatics.7.4","pyq":true},{"id":"electrostatics.7.5","pyq":true},{"id":"electrostatics.7.6","pyq":true}]},{"n":8,"title":"Revision & Mixed PYQs","summary":"The whole chapter on one screen — which tool to pick, the formulas worth memorising, the traps examiners reuse — and three problems that mix it all together.","minutes":20,"questions":[{"id":"electrostatics.8.1","pyq":true},{"id":"electrostatics.8.2","pyq":true},{"id":"electrostatics.8.3","pyq":true}]}],"sections":[{"title":"Forces & Fields","lessons":[1,2]},{"title":"Gauss’s Law","lessons":[3,4]},{"title":"Potential & Dipoles","lessons":[5,6]},{"title":"Conductors & Revision","lessons":[7,8]}],"lab":true},{"id":"current-electricity","title":"Current Electricity","subject":"Physics","unit":"Electromagnetism","tone":"volt","tagline":"Electrons crawl slower than a snail, yet the bulb lights the instant you flip the switch. Drift, Ohm’s law, cells, Kirchhoff’s rules, power, meters and bridges — everything that happens when charge gets moving.","sections":[{"title":"Charge on the Move","lessons":[1,2]},{"title":"Circuits","lessons":[3,4,5]},{"title":"Energy","lessons":[6]},{"title":"Measurement","lessons":[7,8]},{"title":"Wrap-up","lessons":[9]}],"lessons":[{"n":1,"title":"Electric Current & Drift Velocity","summary":"Flip a switch and the light is on before you can blink — yet the electrons in the wire crawl along slower than a snail. Solve that mystery and you understand what a current really is.","minutes":30,"questions":[{"id":"current-electricity.1.1","pyq":false},{"id":"current-electricity.1.2","pyq":false},{"id":"current-electricity.1.3","pyq":true},{"id":"current-electricity.1.4","pyq":false}]},{"n":2,"title":"Ohm’s Law, Resistance & Resistivity","summary":"Why does a longer wire fight the current harder, a fatter one less — and a hot one more? One tiny collision time explains Ohm’s law, resistance, and why a bulb is most likely to blow at the moment you switch it on.","minutes":40,"questions":[{"id":"current-electricity.2.1","pyq":false},{"id":"current-electricity.2.2","pyq":true},{"id":"current-electricity.2.3","pyq":true},{"id":"current-electricity.2.4","pyq":false},{"id":"current-electricity.2.5","pyq":false},{"id":"current-electricity.2.6","pyq":true}]},{"n":3,"title":"Combining Resistors","summary":"Series, parallel — and the three tricks that crack the networks which are neither: spotting equal-potential points, using symmetry, and folding ladders. Most “impossible” JEE networks are easy ones in disguise.","minutes":40,"questions":[{"id":"current-electricity.3.1","pyq":false},{"id":"current-electricity.3.2","pyq":false},{"id":"current-electricity.3.3","pyq":false},{"id":"current-electricity.3.4","pyq":false},{"id":"current-electricity.3.5","pyq":false},{"id":"current-electricity.3.6","pyq":true},{"id":"current-electricity.3.7","pyq":true}]},{"n":4,"title":"Cells, EMF & Internal Resistance","summary":"A battery is a pump that lifts charge uphill — and every real pump leaks a little. Meet emf, the resistance hidden inside every cell, the load that squeezes out the most power, and what happens when cells team up.","minutes":35,"questions":[{"id":"current-electricity.4.1","pyq":false},{"id":"current-electricity.4.2","pyq":false},{"id":"current-electricity.4.3","pyq":true},{"id":"current-electricity.4.4","pyq":true},{"id":"current-electricity.4.5","pyq":true},{"id":"current-electricity.4.6","pyq":false}]},{"n":5,"title":"Kirchhoff’s Laws","summary":"When a circuit refuses to reduce to series and parallel, two bookkeeping rules — one for charge, one for energy — solve it anyway. Learn the sign ritual once and no network can scare you.","minutes":40,"questions":[{"id":"current-electricity.5.1","pyq":false},{"id":"current-electricity.5.2","pyq":false},{"id":"current-electricity.5.3","pyq":true},{"id":"current-electricity.5.4","pyq":false},{"id":"current-electricity.5.5","pyq":false}]},{"n":6,"title":"Energy, Power & the Heating Effect","summary":"Every coulomb that falls through a volt hands over a joule. Follow the energy and you will know why a 40 W bulb can outshine a 100 W one, how to read the label on any appliance, and why power lines carry lakhs of volts.","minutes":40,"questions":[{"id":"current-electricity.6.1","pyq":false},{"id":"current-electricity.6.2","pyq":true},{"id":"current-electricity.6.3","pyq":true},{"id":"current-electricity.6.4","pyq":true},{"id":"current-electricity.6.5","pyq":true},{"id":"current-electricity.6.6","pyq":false}]},{"n":7,"title":"Ammeters, Voltmeters & the Galvanometer","summary":"The moment you connect a meter, it becomes part of the circuit it is trying to measure. Learn how one delicate galvanometer is turned into both an ammeter and a voltmeter — and how to tell which way a real meter lies to you.","minutes":35,"questions":[{"id":"current-electricity.7.1","pyq":false},{"id":"current-electricity.7.2","pyq":true},{"id":"current-electricity.7.3","pyq":true},{"id":"current-electricity.7.4","pyq":false},{"id":"current-electricity.7.5","pyq":true},{"id":"current-electricity.7.6","pyq":true}]},{"n":8,"title":"Wheatstone Bridge, Metre Bridge & Potentiometer","summary":"The most accurate electrical measurements are made by reading nothing at all. Balance a bridge until the galvanometer falls silent, and the unknown drops out as a simple ratio — no calibration, no loading, no trust in the battery required.","minutes":45,"questions":[{"id":"current-electricity.8.1","pyq":false},{"id":"current-electricity.8.2","pyq":true},{"id":"current-electricity.8.3","pyq":true},{"id":"current-electricity.8.4","pyq":true},{"id":"current-electricity.8.5","pyq":true},{"id":"current-electricity.8.6","pyq":true},{"id":"current-electricity.8.7","pyq":true},{"id":"current-electricity.8.8","pyq":false}]},{"n":9,"title":"Revision & Mixed PYQs","summary":"The whole chapter on one screen — which method to reach for, the formulas worth memorising, the traps examiners reuse — and three JEE Advanced problems that stitch it all together.","minutes":25,"questions":[{"id":"current-electricity.9.1","pyq":true},{"id":"current-electricity.9.2","pyq":true},{"id":"current-electricity.9.3","pyq":true}]}],"lab":true},{"id":"magnetism","title":"Magnetic Effects of Current","subject":"Physics","unit":"Electromagnetism","tone":"aurora","tagline":"A compass needle twitches beside a wire, and the northern lights dance over the poles — both for the same reason: moving charge makes magnetism, and magnetism pushes on moving charge. Lorentz force, circles and helices, Biot–Savart and Ampère, forces and torques on currents, the galvanometer, and magnetic materials.","sections":[{"title":"The Magnetic Force","lessons":[1,2]},{"title":"Sources of the Field","lessons":[3,4]},{"title":"Forces & Torques on Currents","lessons":[5,6,7]},{"title":"Magnetism & Matter","lessons":[8]},{"title":"Wrap-up","lessons":[9]}],"lessons":[{"n":1,"title":"The Magnetic Force on a Moving Charge","summary":"In 1820 a compass needle twitched beside a live wire, and physics was never the same. Meet the strangest force in the syllabus — it ignores charges at rest, always pushes sideways, and can never speed anything up.","minutes":35,"questions":[{"id":"magnetism.1.1","pyq":false},{"id":"magnetism.1.2","pyq":true},{"id":"magnetism.1.3","pyq":false},{"id":"magnetism.1.4","pyq":true},{"id":"magnetism.1.5","pyq":true}]},{"n":2,"title":"Circles, Helices & the Cyclotron","summary":"A magnetic field can only steer, so a charge in a uniform field runs round a perfect circle — and every lap takes exactly the same time, however fast it goes. That one fact builds particle accelerators, paints the aurora, and cracks most JEE trajectory problems.","minutes":45,"questions":[{"id":"magnetism.2.1","pyq":false},{"id":"magnetism.2.2","pyq":true},{"id":"magnetism.2.3","pyq":true},{"id":"magnetism.2.4","pyq":true},{"id":"magnetism.2.5","pyq":true},{"id":"magnetism.2.6","pyq":false},{"id":"magnetism.2.7","pyq":true},{"id":"magnetism.2.8","pyq":false}]},{"n":3,"title":"The Biot–Savart Law","summary":"Every tiny piece of a current-carrying wire adds its own little whirl of field. Add up the whirls and you can find the field of any wire you can draw — straight, bent, looped or coiled into a spiral.","minutes":45,"questions":[{"id":"magnetism.3.1","pyq":false},{"id":"magnetism.3.2","pyq":true},{"id":"magnetism.3.3","pyq":true},{"id":"magnetism.3.4","pyq":true},{"id":"magnetism.3.5","pyq":true},{"id":"magnetism.3.6","pyq":false},{"id":"magnetism.3.7","pyq":true},{"id":"magnetism.3.8","pyq":true}]},{"n":4,"title":"Ampère’s Law, Solenoids & Toroids","summary":"Gauss’s law let you skip Coulomb’s integrals whenever a problem was symmetric. Ampère’s law does the same for magnetism — and hands you the fields inside thick wires, solenoids and toroids in a single line.","minutes":40,"questions":[{"id":"magnetism.4.1","pyq":true},{"id":"magnetism.4.2","pyq":false},{"id":"magnetism.4.3","pyq":false},{"id":"magnetism.4.4","pyq":false},{"id":"magnetism.4.5","pyq":true}]},{"n":5,"title":"Forces on Wires & Between Currents","summary":"Put a current in a magnetic field and the whole wire gets shoved sideways — the push behind every electric motor and loudspeaker. Bend the wire any way you like and only its two ends matter; and two currents side by side pull together, which is exactly how the ampere was once defined.","minutes":45,"questions":[{"id":"magnetism.5.1","pyq":false},{"id":"magnetism.5.2","pyq":false},{"id":"magnetism.5.3","pyq":true},{"id":"magnetism.5.4","pyq":false},{"id":"magnetism.5.5","pyq":false},{"id":"magnetism.5.6","pyq":true},{"id":"magnetism.5.7","pyq":false},{"id":"magnetism.5.8","pyq":true}]},{"n":6,"title":"Torque on a Loop & the Magnetic Dipole","summary":"A current loop in a magnetic field feels no net force — yet it twists. That twist drives every electric motor, and it reveals a surprise: a current loop *is* a magnet, with a north end and a south end, and so is every spinning electron.","minutes":40,"questions":[{"id":"magnetism.6.1","pyq":false},{"id":"magnetism.6.2","pyq":true},{"id":"magnetism.6.3","pyq":true},{"id":"magnetism.6.4","pyq":true},{"id":"magnetism.6.5","pyq":false},{"id":"magnetism.6.6","pyq":false},{"id":"magnetism.6.7","pyq":false}]},{"n":7,"title":"The Moving-Coil Galvanometer","summary":"Put the torque on a coil to work and you can see a current of a few microamperes. One clever trick — a radial magnetic field — makes the needle’s swing exactly proportional to the current, and two sensitivities tell you how good the meter is.","minutes":30,"questions":[{"id":"magnetism.7.1","pyq":false},{"id":"magnetism.7.2","pyq":false},{"id":"magnetism.7.3","pyq":false},{"id":"magnetism.7.4","pyq":true}]},{"n":8,"title":"Bar Magnets & Magnetic Materials","summary":"A fridge magnet has no wires and no battery — so where is its current? Inside every atom. Meet the magnet as a solenoid in disguise, the pole you can never cut off, and the three ways matter answers a magnetic field: shy away, lean in, or line up completely.","minutes":40,"questions":[{"id":"magnetism.8.1","pyq":false},{"id":"magnetism.8.2","pyq":false},{"id":"magnetism.8.3","pyq":true},{"id":"magnetism.8.4","pyq":false},{"id":"magnetism.8.5","pyq":true},{"id":"magnetism.8.6","pyq":false}]},{"n":9,"title":"Revision & Mixed PYQs","summary":"The whole chapter on one screen — which tool to reach for, the formulas worth memorising, the traps examiners reuse — and four JEE Advanced problems that stitch it all together.","minutes":30,"questions":[{"id":"magnetism.9.1","pyq":true},{"id":"magnetism.9.2","pyq":true},{"id":"magnetism.9.3","pyq":true},{"id":"magnetism.9.4","pyq":true}]}],"lab":true},{"id":"thermodynamics","title":"Heat & Thermodynamics","subject":"Physics","unit":"Thermal Physics","tone":"ember","tagline":"From “why does steel feel colder than wood?” to engines, fridges and glowing stars — temperature, calorimetry, the laws of thermodynamics and all three ways heat travels.","sections":[{"title":"Heat & Temperature","lessons":[1,2]},{"title":"Calorimetry","lessons":[3]},{"title":"Laws of Thermodynamics","lessons":[4,5,6]},{"title":"Heat Transfer","lessons":[7,8]},{"title":"Wrap-up","lessons":[9]}],"lessons":[{"n":1,"title":"Temperature & the Zeroth Law","summary":"Your fingers are terrible thermometers. Here is what temperature really measures, why a “zeroth” law had to be squeezed in before the first, and why every temperature scale is just a straight line.","minutes":25,"questions":[{"id":"thermodynamics.1.1","pyq":false},{"id":"thermodynamics.1.2","pyq":false},{"id":"thermodynamics.1.3","pyq":true},{"id":"thermodynamics.1.4","pyq":false}]},{"n":2,"title":"Thermal Expansion","summary":"Heat something and it grows — rails, bridges, mercury threads, even the holes in things. One tiny coefficient explains clocks that run slow, jam-jar lids that won’t budge, and why fish survive the winter.","minutes":35,"questions":[{"id":"thermodynamics.2.1","pyq":false},{"id":"thermodynamics.2.2","pyq":false},{"id":"thermodynamics.2.3","pyq":true},{"id":"thermodynamics.2.4","pyq":true},{"id":"thermodynamics.2.5","pyq":true},{"id":"thermodynamics.2.6","pyq":false}]},{"n":3,"title":"Calorimetry","summary":"Heat is not something a body has — it is energy on the move. Learn to keep its accounts: specific heat, latent heat, and the single bookkeeping rule that cracks every mixing problem.","minutes":40,"questions":[{"id":"thermodynamics.3.1","pyq":false},{"id":"thermodynamics.3.2","pyq":false},{"id":"thermodynamics.3.3","pyq":true},{"id":"thermodynamics.3.4","pyq":true},{"id":"thermodynamics.3.5","pyq":true},{"id":"thermodynamics.3.6","pyq":true}]},{"n":4,"title":"The First Law: Heat, Work & Internal Energy","summary":"Energy conservation, upgraded to include heat. One equation, three quantities — and a diagram on which work is nothing more than an area.","minutes":40,"questions":[{"id":"thermodynamics.4.1","pyq":false},{"id":"thermodynamics.4.2","pyq":false},{"id":"thermodynamics.4.3","pyq":true},{"id":"thermodynamics.4.4","pyq":true},{"id":"thermodynamics.4.5","pyq":false},{"id":"thermodynamics.4.6","pyq":true}]},{"n":5,"title":"Specific Heats of a Gas & the Adiabatic Process","summary":"A gas does not have one specific heat — it has infinitely many. Two of them, at constant volume and at constant pressure, unlock every process — including the adiabatic one that fires diesel engines and builds clouds.","minutes":45,"questions":[{"id":"thermodynamics.5.1","pyq":false},{"id":"thermodynamics.5.2","pyq":true},{"id":"thermodynamics.5.3","pyq":true},{"id":"thermodynamics.5.4","pyq":true},{"id":"thermodynamics.5.5","pyq":false},{"id":"thermodynamics.5.6","pyq":true},{"id":"thermodynamics.5.7","pyq":true}]},{"n":6,"title":"The Second Law: Engines, Fridges & Carnot","summary":"The first law says you can’t get more energy out than you put in. The second says you can’t even get that. Meet the law that gives time its direction — and puts a hard ceiling on every engine ever built.","minutes":40,"questions":[{"id":"thermodynamics.6.1","pyq":false},{"id":"thermodynamics.6.2","pyq":false},{"id":"thermodynamics.6.3","pyq":true},{"id":"thermodynamics.6.4","pyq":true},{"id":"thermodynamics.6.5","pyq":true}]},{"n":7,"title":"Heat Transfer I: Conduction","summary":"Heat creeping through a solid behaves exactly like current through a resistor. Learn that one analogy and every rod, slab and frozen-lake problem turns into a circuit you already know how to solve.","minutes":35,"questions":[{"id":"thermodynamics.7.1","pyq":false},{"id":"thermodynamics.7.2","pyq":false},{"id":"thermodynamics.7.3","pyq":true},{"id":"thermodynamics.7.4","pyq":true},{"id":"thermodynamics.7.5","pyq":true},{"id":"thermodynamics.7.6","pyq":false}]},{"n":8,"title":"Heat Transfer II: Convection, Radiation & Cooling","summary":"How the Sun’s warmth crosses 150 million kilometres of nothing, why a star’s colour is a thermometer, and the law that predicts when your tea will be cool enough to drink.","minutes":40,"questions":[{"id":"thermodynamics.8.1","pyq":false},{"id":"thermodynamics.8.2","pyq":true},{"id":"thermodynamics.8.3","pyq":true},{"id":"thermodynamics.8.4","pyq":true},{"id":"thermodynamics.8.5","pyq":true},{"id":"thermodynamics.8.6","pyq":true},{"id":"thermodynamics.8.7","pyq":false}]},{"n":9,"title":"Revision & Mixed PYQs","summary":"The whole chapter on one screen — which idea to reach for, the formulas worth memorising, the traps examiners reuse — and three problems that stitch it all together.","minutes":25,"questions":[{"id":"thermodynamics.9.1","pyq":true},{"id":"thermodynamics.9.2","pyq":true},{"id":"thermodynamics.9.3","pyq":true}]}],"lab":true},{"id":"alcohols-phenols-and-ethers","title":"Alcohols, Phenols & Ethers","subject":"Chemistry","unit":"Organic Chemistry","tone":"vine","tagline":"From hand sanitiser to aspirin to the first surgical anaesthetic — one oxygen atom, three personalities. Every JEE Main idea on alcohols, phenols and ethers, with labs you can play with.","lessons":[{"n":1,"title":"Meet the –OH Family","summary":"One oxygen atom, three personalities. Learn to classify, name and picture alcohols, phenols and ethers — and why none of their bond angles is the textbook 109.5°.","minutes":30,"questions":[{"id":"alcohols-phenols-and-ethers.1.1","pyq":false},{"id":"alcohols-phenols-and-ethers.1.2","pyq":true},{"id":"alcohols-phenols-and-ethers.1.3","pyq":true},{"id":"alcohols-phenols-and-ethers.1.4","pyq":false},{"id":"alcohols-phenols-and-ethers.1.5","pyq":false}]},{"n":2,"title":"Making Alcohols","summary":"Three roads to an –OH: add water across a C=C (two ways, opposite answers), reduce a C=O, or let a Grignard reagent build the carbon skeleton for you.","minutes":35,"questions":[{"id":"alcohols-phenols-and-ethers.2.1","pyq":false},{"id":"alcohols-phenols-and-ethers.2.2","pyq":true},{"id":"alcohols-phenols-and-ethers.2.3","pyq":false},{"id":"alcohols-phenols-and-ethers.2.4","pyq":false},{"id":"alcohols-phenols-and-ethers.2.5","pyq":true},{"id":"alcohols-phenols-and-ethers.2.6","pyq":true},{"id":"alcohols-phenols-and-ethers.2.7","pyq":false}]},{"n":3,"title":"Making Phenols","summary":"A 300-atmosphere pressure cooker, a salt that fizzes nitrogen, and the cumene process that makes phenol and acetone in one go.","minutes":25,"questions":[{"id":"alcohols-phenols-and-ethers.3.1","pyq":true},{"id":"alcohols-phenols-and-ethers.3.2","pyq":true},{"id":"alcohols-phenols-and-ethers.3.3","pyq":true},{"id":"alcohols-phenols-and-ethers.3.4","pyq":false},{"id":"alcohols-phenols-and-ethers.3.5","pyq":false}]},{"n":4,"title":"Boiling Points & Solubility","summary":"Why ethanol boils almost 100 K above an ether of the same mass, why ethanol mixes with water but butanol barely does — and why one nitrophenol escapes with steam.","minutes":25,"questions":[{"id":"alcohols-phenols-and-ethers.4.1","pyq":false},{"id":"alcohols-phenols-and-ethers.4.2","pyq":false},{"id":"alcohols-phenols-and-ethers.4.3","pyq":true},{"id":"alcohols-phenols-and-ethers.4.4","pyq":false},{"id":"alcohols-phenols-and-ethers.4.5","pyq":false}]},{"n":5,"title":"Acidity: Who Lets Go of H⁺?","summary":"Sodium fizzes with all of them, but only phenol dissolves in caustic soda. The whole story is the stability of the anion left behind — and you can watch it on the pKa ladder.","minutes":35,"questions":[{"id":"alcohols-phenols-and-ethers.5.1","pyq":false},{"id":"alcohols-phenols-and-ethers.5.2","pyq":true},{"id":"alcohols-phenols-and-ethers.5.3","pyq":false},{"id":"alcohols-phenols-and-ethers.5.4","pyq":true},{"id":"alcohols-phenols-and-ethers.5.5","pyq":false},{"id":"alcohols-phenols-and-ethers.5.6","pyq":false}]},{"n":6,"title":"Breaking C–O: Substitution & Dehydration","summary":"Turn –OH into a leaving group and alcohols become halides, alkenes or ethers. Race the Lucas test, and step through the carbocation that sometimes rearranges itself.","minutes":35,"questions":[{"id":"alcohols-phenols-and-ethers.6.1","pyq":false},{"id":"alcohols-phenols-and-ethers.6.2","pyq":true},{"id":"alcohols-phenols-and-ethers.6.3","pyq":true},{"id":"alcohols-phenols-and-ethers.6.4","pyq":false},{"id":"alcohols-phenols-and-ethers.6.5","pyq":true},{"id":"alcohols-phenols-and-ethers.6.6","pyq":true},{"id":"alcohols-phenols-and-ethers.6.7","pyq":false},{"id":"alcohols-phenols-and-ethers.6.8","pyq":true}]},{"n":7,"title":"Oxidation & Telling Alcohols Apart","summary":"Primary, secondary or tertiary? Oxidise it, heat it on copper, or look for a yellow iodoform cloud. Plus the chemistry inside a police breathalyser.","minutes":25,"questions":[{"id":"alcohols-phenols-and-ethers.7.1","pyq":true},{"id":"alcohols-phenols-and-ethers.7.2","pyq":false},{"id":"alcohols-phenols-and-ethers.7.3","pyq":true},{"id":"alcohols-phenols-and-ethers.7.4","pyq":false},{"id":"alcohols-phenols-and-ethers.7.5","pyq":false}]},{"n":8,"title":"Phenol’s Hyperactive Ring","summary":"The –OH makes the benzene ring so electron-rich that bromine water alone puts on three bromines. Nitration, halogenation, Kolbe, Reimer–Tiemann — all in one explorer.","minutes":35,"questions":[{"id":"alcohols-phenols-and-ethers.8.1","pyq":true},{"id":"alcohols-phenols-and-ethers.8.2","pyq":false},{"id":"alcohols-phenols-and-ethers.8.3","pyq":true},{"id":"alcohols-phenols-and-ethers.8.4","pyq":true},{"id":"alcohols-phenols-and-ethers.8.5","pyq":false},{"id":"alcohols-phenols-and-ethers.8.6","pyq":true},{"id":"alcohols-phenols-and-ethers.8.7","pyq":false}]},{"n":9,"title":"Ethers: The Quiet Cousins","summary":"Unreactive enough to be the perfect solvent, until HI arrives. Williamson synthesis, its one big trap, and which side of the oxygen the iodide attacks.","minutes":30,"questions":[{"id":"alcohols-phenols-and-ethers.9.1","pyq":false},{"id":"alcohols-phenols-and-ethers.9.2","pyq":true},{"id":"alcohols-phenols-and-ethers.9.3","pyq":true},{"id":"alcohols-phenols-and-ethers.9.4","pyq":false},{"id":"alcohols-phenols-and-ethers.9.5","pyq":false},{"id":"alcohols-phenols-and-ethers.9.6","pyq":false}]},{"n":10,"title":"Wrap-up: The Reaction Map","summary":"Every reaction of the chapter on one map, a detective case with four bottles of C₄H₁₀O, and Reagent Rush — a quick-fire game to lock it all in.","minutes":25,"questions":[{"id":"alcohols-phenols-and-ethers.10.1","pyq":false},{"id":"alcohols-phenols-and-ethers.10.2","pyq":false},{"id":"alcohols-phenols-and-ethers.10.3","pyq":false},{"id":"alcohols-phenols-and-ethers.10.4","pyq":false},{"id":"alcohols-phenols-and-ethers.10.5","pyq":false}]}],"sections":[{"title":"Meet the Family","lessons":[1]},{"title":"Making Them","lessons":[2,3]},{"title":"How They Behave","lessons":[4,5]},{"title":"Alcohols in Action","lessons":[6,7]},{"title":"Phenol’s Ring","lessons":[8]},{"title":"Ethers","lessons":[9]},{"title":"Wrap-up","lessons":[10]}],"lab":true}]}</script>
